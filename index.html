<!DOCTYPE html>
<html lang="zh-CN" data-text="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234F42">
<meta name="description" content="MOS-MUSIC｜音乐门徒训练平台。以圣经真理为核心，以音乐为形成媒介，支持离线使用。">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MOS-MUSIC">
<title>MOS-MUSIC｜音乐门徒训练</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="app/ui/tokens.css">
<link rel="stylesheet" href="app/ui/components.css">
<link rel="stylesheet" href="app/ui/v21.css">
<link rel="stylesheet" href="app/ui/v30.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brandmark" aria-hidden="true">♪</div>
      <div>
        <strong id="mainTitle">MOS-MUSIC</strong>
        <small>真理 × 音乐 × 共同体 × 实践</small>
      </div>
    </div>
    <div class="btn-row" style="margin:0">
      <span id="netBadge" class="chip">网络未探测</span>
      <span id="outboxBadge" class="chip">已同步</span>
      <button id="textBtn" class="ghost" title="切换大字体" aria-label="切换大字体">字</button>
      <button id="moodBtn" class="ghost mood-btn" title="深夜模式" aria-label="切换深夜沉浸模式" aria-pressed="false">☾</button>
      <button id="installBtn" class="ghost" hidden title="安装到主屏幕" aria-label="安装到主屏幕">安装</button>
      <button id="syncBtn" class="ghost" title="立即同步" aria-label="立即同步">同步</button>
    </div>
  </header>

  <div id="updateBar" class="notice" hidden>
    有新版本可用。<button class="link" id="updateApply">立即更新</button>
  </div>
  <div id="syncResult" class="notice" hidden></div>

  <noscript>
    <div class="notice error">MOS-MUSIC 需要 JavaScript 才能运行。离线能力依赖 Service Worker 与 IndexedDB。</div>
  </noscript>

  <main id="view" role="main" aria-live="polite">
    <div class="empty">正在启动…</div>
  </main>
</div>

<nav class="bottom" aria-label="主导航">
  <div class="nav" id="nav"></div>
</nav>

<script type="module">
  import { boot } from './app/shell.js';
  boot().catch((err) => {
    const v = document.getElementById('view');
    if (v) {
      v.innerHTML = '<div class="notice error">启动失败：' +
        String(err && err.message ? err.message : err).replace(/[<>&]/g, '') +
        '<br><br>若以 file:// 打开，请改用本地静态服务器（例如项目根目录执行 <span class="mono">python -m http.server</span> 后访问 http://localhost:8000/）。</div>';
    }
    console.error('[mos-music] boot failed', err);
  });
</script>
</body>
</html>
