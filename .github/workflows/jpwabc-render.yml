name: MOS-MUSIC JPWABC Render Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOS-MUSIC
        uses: actions/checkout@v4

      - name: Checkout pinned jpeditor
        uses: actions/checkout@v4
        with:
          repository: lodebar2026/jpeditor
          ref: 4147f58f3a09e7d8656bb14e028d0daa4e51620a
          path: jpeditor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jpeditor/package-lock.json

      - name: Install jpeditor
        working-directory: jpeditor
        run: npm ci

      - name: Install Chromium
        working-directory: jpeditor
        run: npx playwright install --with-deps chromium

      - name: Copy MOS JPWABC fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jpeditor/public/mos-test
          for id in MUS-S-0001 MUS-S-0002 MUS-S-0004; do
            cp "content/production/packages/$id/score.jpwabc" "jpeditor/public/mos-test/$id.jpwabc"
          done

      - name: Install render smoke script
        shell: bash
        run: cp tools/score-pipeline/jpwabc-render-smoke.mjs jpeditor/jpwabc-render-smoke.mjs

      - name: Start jpeditor dev server
        working-directory: jpeditor
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/jpeditor-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:1420/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jpeditor-vite.log
          exit 1

      - name: Run actual JPWABC parser + SVG render
        working-directory: jpeditor
        run: node jpwabc-render-smoke.mjs

      - name: Publish diagnostic commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary="no-summary"
          if [ -f jpeditor/mos-render-evidence/summary.json ]; then
            summary=$(node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("jpeditor/mos-render-evidence/summary.json","utf8"));console.log(s.results.map(r=>r.songId+"="+r.status+(r.docNotes!==undefined?":"+r.docNotes+"n/"+r.docLyrics+"l/"+r.pageCount+"p":"")).join(";"))')
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"             -f state="${{ job.status == 'success' && 'success' || 'failure' }}"             -f context="MOS-MUSIC JPWABC diagnostic"             -f description="${summary:0:140}"             -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


      - name: Publish diagnostic PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          body="<!-- MOS-MUSIC JPWABC DIAGNOSTIC -->"$'\n\n'
          if [ -f jpeditor/mos-render-evidence/summary.json ]; then
            body="$body$(cat jpeditor/mos-render-evidence/summary.json)"
          else
            body="$body No runtime summary was produced."
          fi
          existing_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate --jq '.[] | select(.body | startswith("'"<!-- MOS-MUSIC JPWABC DIAGNOSTIC -->"'")) | .id' | tail -n 1 || true)
          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing_id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

      - name: Upload rendered page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mos-music-jpwabc-render-evidence
          path: |
            jpeditor/mos-render-evidence/**
          if-no-files-found: ignore
